[package]
name = "pleme-fleet"
version = "0.1.8"
edition = "2021"
license = "MIT"
authors = ["Pleme Team <team@pleme.io>"]
description = "NixOS fleet lifecycle CLI with DAG workflow orchestration"
repository = "https://github.com/pleme-io/fleet"
homepage = "https://github.com/pleme-io/fleet"
keywords = ["nixos", "fleet", "orchestration", "dag", "lifecycle"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["module/", "target/", "result-*", "Cargo.nix", "flake.nix", "flake.lock"]

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# MCP transport for `fleet mcp` — the same rmcp 0.15 + tool_router shape
# engenho-mcp uses, so the fleet has ONE way to expose a tool surface.
rmcp = { version = "0.15", features = ["server", "transport-io", "macros"] }
schemars = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
colored = "2.1"
serde_yaml_ng = "0.10"
fs4 = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
