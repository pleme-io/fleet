[package]
resolver = "3"
# ── ★ MSRV IS ENFORCED, NOT DECORATIVE ──────────────────────────────────
# `rust-version` alone does NOTHING under resolver 2 (the edition-2021
# default): cargo ignores it when selecting dependency versions. Both lines
# are required, and resolver 3 is the half that binds.
#
# MEASURED 2026-08-05/06: `kstring@2.0.4` (requires rustc 1.96.0) entered
# codesearch's lockfile, and because codesearch is in every node's
# home-manager closure it stopped the ENTIRE fleet rebuilding — rio sat on a
# stale generation for six hours. It was pinned back with `cargo update
# --precise`, and the very next release regenerated the lock and REVERTED the
# pin. A lockfile pin cannot survive its own release automation; a declaration
# constrains resolution instead of recording its result.
#
# 1.95.0 is the fleet toolchain (`pkgs.fenixRustToolchain`, stable). Declaring
# the version we actually build with — rather than a lower floor we never test
# — enforces exactly the failure mode (a dep needing MORE than our rustc)
# without downgrading anything that works today.
rust-version = "1.95.0"
name = "pleme-fleet"
version = "0.1.13"
edition = "2021"
license = "MIT"
authors = ["Pleme Team <team@pleme.io>"]
description = "NixOS fleet lifecycle CLI with DAG workflow orchestration"
repository = "https://github.com/pleme-io/fleet"
homepage = "https://github.com/pleme-io/fleet"
keywords = ["nixos", "fleet", "orchestration", "dag", "lifecycle"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["module/", "target/", "result-*", "Cargo.nix", "flake.nix", "flake.lock"]

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# MCP transport for `fleet mcp` — the same rmcp + tool_router shape
# 1.4, not 0.15: GHSA-89vp-x53w-74fx (high) is fixed in 1.4.0. The comment
# here used to pin the claim to "0.15", which was also the version tend had
# already moved OFF — so the fleet was running two rmcp majors while a note
# asserted they matched.
# engenho-mcp uses, so the fleet has ONE way to expose a tool surface.
rmcp = { version = "1.4", features = ["server", "transport-io", "macros"] }
schemars = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
colored = "2.1"
serde_yaml_ng = "0.10"
fs4 = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
